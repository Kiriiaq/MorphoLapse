[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morpholapse"
version = "2.2.0"
description = "MorphoLapse - Facial Morphing & Time-Lapse Generator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kiriiaq"}]
keywords = ["face", "morphing", "timelapse", "video", "dlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "customtkinter>=5.2.0,<6.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "numpy>=1.24.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "Pillow>=10.0.0,<11.0.0",
    "dlib>=19.24.0,<20.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.4.0", "build", "pyinstaller>=6.0.0"]

[project.urls]
Homepage = "https://github.com/Kiriiaq/MorphoLapse"
Issues = "https://github.com/Kiriiaq/MorphoLapse/issues"

[project.scripts]
morpholapse = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.ico", "*.png", "*.dat"]

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# SIM105 ignoré : try/except/pass est un pattern défensif assumé pour les
# callbacks UI et le drainage de pipes subprocess où contextlib.suppress
# alourdirait la lecture sans bénéfice.
ignore = ["E501", "B008", "SIM108", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is the standard pytest pattern

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (subprocess, real I/O, >1s)",
    "volume: large data tests",
    "perf: micro-benchmarks",
    "stress: repeated/concurrent ops",
]
addopts = "-v --tb=short"
